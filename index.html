<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rotated clip masking</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: #10131a; color: #d8dce8;
      font: 13px/1.4 system-ui, sans-serif;
    }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #overlay { pointer-events: none; }
    #panel {
      position: fixed; top: 12px; right: 12px; max-width: calc(100% - 48px);
      padding: 10px 12px;
      background: rgba(16, 19, 26, 0.85); border: 1px solid #2a3040; border-radius: 8px;
    }
    #panel summary { font-weight: 600; cursor: pointer; }
    #panel .body { display: grid; gap: 6px; margin-top: 8px; }
    #panel label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
    #github {
      display: flex; gap: 8px; align-items: center; justify-content: center;
      margin-top: 6px; padding: 10px 14px;
      background: #2a3040; border: 1px solid #3a4258; border-radius: 6px;
      color: #eef1f8; font-size: 15px; font-weight: 600; text-decoration: none;
    }
    #github:hover { background: #343c52; border-color: #4a5470; }
    #github svg { width: 20px; height: 20px; fill: currentColor; }
    #stats { margin-top: 4px; font: 12px/1.45 ui-monospace, monospace; color: #9aa3b8; white-space: pre; }
    #error {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      max-width: calc(100% - 32px); padding: 8px 12px; display: none;
      background: #3a1418; border: 1px solid #a33; border-radius: 6px; color: #ffb4b4;
      font: 12px ui-monospace, monospace;
    }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <canvas id="overlay"></canvas>
  <details id="panel" open>
    <summary>Rotated clip masking</summary>
    <div class="body">
      <label><input type="checkbox" id="animate"> Animate</label>
      <label><input type="checkbox" id="smooth"> Smooth trimmed edges (fwidth)</label>
      <label><input type="checkbox" id="surplus"> Show trimmed surplus</label>
      <label><input type="checkbox" id="outlines"> Show effective clips</label>
      <label><input type="checkbox" id="mixed"> Mixed basis (throws)</label>
      <label>Nest depth <input type="range" id="depth" min="1" max="40"> <span id="depthVal"></span></label>
      <div id="stats"></div>
      <a id="github" href="https://github.com/koteelok/oriented-bbox-clipping" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        Open on GitHub
      </a>
    </div>
  </details>
  <div id="error"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
