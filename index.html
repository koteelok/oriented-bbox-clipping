<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rotated clip masking</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: #10131a; color: #d8dce8;
      font: 13px/1.4 system-ui, sans-serif;
    }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #overlay { pointer-events: none; }
    #panel {
      position: fixed; top: 12px; right: 12px; max-width: calc(100% - 48px);
      padding: 10px 12px;
      background: rgba(16, 19, 26, 0.85); border: 1px solid #2a3040; border-radius: 8px;
    }
    #panel summary { font-weight: 600; cursor: pointer; }
    #panel .body { display: grid; gap: 6px; margin-top: 8px; }
    #panel label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
    #stats { margin-top: 4px; font: 12px/1.45 ui-monospace, monospace; color: #9aa3b8; white-space: pre; }
    #error {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      max-width: calc(100% - 32px); padding: 8px 12px; display: none;
      background: #3a1418; border: 1px solid #a33; border-radius: 6px; color: #ffb4b4;
      font: 12px ui-monospace, monospace;
    }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <canvas id="overlay"></canvas>
  <details id="panel" open>
    <summary>Rotated clip masking: step 1</summary>
    <div class="body">
      <label><input type="checkbox" id="animate"> Animate</label>
      <label><input type="checkbox" id="smooth"> Smooth trimmed edges (fwidth)</label>
      <label><input type="checkbox" id="surplus"> Show trimmed surplus</label>
      <label><input type="checkbox" id="outlines"> Show effective clips</label>
      <label><input type="checkbox" id="mixed"> Mixed basis (throws)</label>
      <label>Nest depth <input type="range" id="depth" min="1" max="40"> <span id="depthVal"></span></label>
      <div id="stats"></div>
    </div>
  </details>
  <div id="error"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
